[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sd-app"
version = "1.2.0"
description = "Локальное настольное приложение: SD Image Generator + GPON FTTH Planner (CPU-optimized)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "lagalsa-pixel" }
]
keywords = [
    "stable-diffusion",
    "gpon",
    "ftth",
    "fiber-optic",
    "network-planning",
    "image-generation",
    "offline",
    "cpu-optimized",
    "tkinter",
    "desktop-app",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Win32 (MS Windows)",
    "Environment :: X11 Applications",
    "Environment :: MacOS X",
    "Intended Audience :: End Users/Desktop",
    "Intended Audience :: Telecommunications Industry",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: Russian",
    "Operating System :: Microsoft :: Windows :: Windows 10",
    "Operating System :: Microsoft :: Windows :: Windows 11",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS :: MacOS X",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Graphics",
    "Topic :: Scientific/Engineering :: GIS",
    "Topic :: Telecommunications",
]
dependencies = [
    "Pillow>=10.0.0",
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "requests>=2.28.0",
]

[project.optional-dependencies]
sd = [
    "torch>=2.1.0",
    "torchvision>=0.16.0",
    "diffusers>=0.27.0",
    "transformers>=4.38.0",
    "accelerate>=0.25.0",
]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "pyinstaller>=5.13",
]
all = [
    "torch>=2.1.0",
    "torchvision>=0.16.0",
    "diffusers>=0.27.0",
    "transformers>=4.38.0",
    "accelerate>=0.25.0",
    "pyinstaller>=5.13",
]

[project.urls]
"Homepage" = "https://github.com/lagalsa-pixel/sd-app"
"Bug Tracker" = "https://github.com/lagalsa-pixel/sd-app/issues"
"Algorithm Source" = "https://github.com/lagalsa-pixel/gpon-ftth-planner"

[tool.setuptools]
py-modules = [
    "main",
    "config",
    "generator",
    "translator",
    "gpon_planner",
    "ftth_renderer",
    "updater",
]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q"
testpaths = [
    "tests",
]
