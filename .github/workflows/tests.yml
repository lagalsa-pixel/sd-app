name: Tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  syntax-check:
    name: Python syntax check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check Python syntax
        run: |
          for f in *.py; do
            echo "Checking $f..."
            python -m py_compile "$f" || exit 1
          done
          echo "All Python files have valid syntax."

  import-check:
    name: Import check (critical modules)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install minimal dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy scipy Pillow requests
      - name: Check critical modules
        run: |
          python -c "import config; print('config OK')"
          python -c "import updater; print('updater OK')"
          python -c "from gpon_planner import GPONPlanner, VillageSpec; print('gpon_planner OK')"
          python -c "from ftth_renderer import render_network_map; print('ftth_renderer OK')"
          python -c "from translator import RuEnTranslator; print('translator OK')"

  gpon-algorithm-test:
    name: GPON algorithm unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy scipy Pillow requests
      - name: Run algorithm tests
        run: |
          python -c "
          import sys
          sys.path.insert(0, '.')
          from gpon_planner import (
              DEFAULT_PARAMS, decompose, ceilr, roundup01,
              geo_to_px, px_to_geo, m_per_px,
          )
          assert decompose(8, [8, 12, 16]) == [8]
          assert decompose(20, [8, 12, 16, 24]) == [24]
          assert ceilr(770.0000001) == 770
          assert roundup01(5.123) == 5.2
          lat, lon = 50.0, 82.0
          mpp = m_per_px(lat, 18)
          west, north = 81.9, 50.1
          x, y = geo_to_px(lat, lon, west, north, mpp)
          la2, lo2 = px_to_geo(x, y, lat, west, north, mpp)
          assert abs(la2 - lat) < 1e-6
          assert abs(lo2 - lon) < 1e-6
          from gpon_planner import GPONPlanner, VillageSpec
          planner = GPONPlanner(work_dir='/tmp/gpon_test')
          v = VillageSpec(key='test', name='Test', lat=50.0, lon=82.0, hh=100)
          print('=== ALL TESTS PASSED ===')
          "

  updater-test:
    name: Updater module test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy scipy Pillow requests
      - name: Test updater
        run: |
          python -c "
          from updater import check_dependencies, _parse_version, _version_ge
          assert _version_ge('2.1.0', '2.1.0')
          assert _version_ge('2.2.0', '2.1.0')
          assert not _version_ge('2.0.0', '2.1.0')
          r = check_dependencies(check_sd=False)
          assert not r['need_install'], f'Не хватает: {r}'
          print(f'check_dependencies: OK ({len(r[\"ok\"])} пакетов)')
          "
